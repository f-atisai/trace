[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-tlf"
version = "0.1.0"
description = "Lightweight execution logging for Python statistical programming."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "TRACE contributors" },
]
keywords = [
    "clinical-programming",
    "statistical-programming",
    "logging",
    "clinical-trials",
    "traceability",
    "auditability",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "numpy>=1.26",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/f-atisai/trace"
Repository = "https://github.com/f-atisai/trace"
Issues = "https://github.com/f-atisai/trace/issues"
Changelog = "https://github.com/f-atisai/trace/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
