[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-tlf"
version = "0.1.0"
description = "Structured logging for Python statistical programming."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TRACE contributors" },
]
keywords = [
    "clinical-programming",
    "statistical-programming",
    "structured-logging",
    "clinical-trials",
    "traceability",
    "auditability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "numpy>=1.26",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
examples = [
    "pandas>=2.2",
    "polars>=1.0",
    "rtflite>=1.0",
]

[project.urls]
Homepage = "https://github.com/f-atisai/trace"
Documentation = "https://github.com/f-atisai/trace/tree/main/docs"
Repository = "https://github.com/f-atisai/trace"
Issues = "https://github.com/f-atisai/trace/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trace_tlf*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]